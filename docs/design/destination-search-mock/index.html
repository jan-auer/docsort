* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--page-bg);
  color: var(--fg);
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
button, input { font: inherit; color: inherit; }
kbd {
  font-family: inherit; font-size: 11px; background: var(--kbd-bg); border-radius: 4px;
  padding: 0 4px; white-space: nowrap;
}
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; background: var(--code-bg); border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }

/* ---------- Header ---------- */
.intro { margin-bottom: 20px; }
.intro h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--search-bg); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 5px; font-size: 12px; cursor: default; color: var(--fg); }
.seg.big button { font-size: 13px; padding: 4px 14px; }
.seg button[aria-checked="true"] { background: var(--control-bg); box-shadow: var(--control-shadow), 0 0 0 0.5px var(--control-border); font-weight: 600; }
.seg button:focus-visible, .page-btn:focus-visible, .sidebar-pill:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
.desc { margin: 0; max-width: 78ch; line-height: 1.5; color: var(--fg2); font-size: 13px; min-height: 3em; }

/* ---------- Layout ---------- */
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px 28px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; max-width: 340px; width: 100%; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; }
.card h2 { margin: 0; font-size: 13px; font-weight: 600; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.note { margin: 4px 0 8px; font-size: 12px; color: var(--fg2); line-height: 1.4; }
.page-btn {
  border: 0.5px solid var(--control-border); background: var(--button-bg); border-radius: 6px; padding: 3px 12px;
  font-size: 12px; box-shadow: var(--control-shadow); cursor: default;
}
.page-btn:hover { background: var(--button-hover); }
.page-btn:active { background: var(--button-press); }

/* tasks */
.tasks ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tasks li { display: flex; gap: 9px; align-items: flex-start; line-height: 1.45; }
.tick {
  flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1.2px var(--control-border); color: var(--accent-fg);
}
.tick svg { width: 11px; height: 11px; }
.tasks li.done .tick { background: var(--success); box-shadow: none; }
.tasks li.done .tt { color: var(--fg2); }
.tt { min-width: 0; }
.tk { display: block; font-size: 12px; color: var(--fg2); margin-top: 1px; }
.tk kbd { font-size: 11.5px; }

/* key reference */
.keys .kr { display: flex; gap: 10px; font-size: 12px; padding: 3px 0; border-bottom: 0.5px solid var(--separator); }
.keys .kr .kk { flex: 0 0 104px; color: var(--fg); font-weight: 500; }
.keys .kr .what { color: var(--fg2); flex: 1; min-width: 0; }
.keys h2 { margin-bottom: 6px; }
.kr-gap { height: 10px; }

/* ---------- Sidebar focus stop ---------- */
.sidebar-pill {
  display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; margin-bottom: 10px; border-radius: 12px;
  background: var(--card); box-shadow: 0 0 0 0.5px var(--control-border); color: var(--fg2); font-size: 12px;
  white-space: nowrap; overflow: hidden; cursor: default; outline: none;
}
.sidebar-pill .sb-lbl { font-weight: 600; }
.sidebar-pill .sb-file { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sidebar-pill.focused { background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 3px var(--focus-ring); }

/* ---------- Filing panel (today's look) ---------- */
.panel {
  width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px;
  background: var(--window-bg); border-radius: 12px; box-shadow: var(--panel-shadow), 0 0 0 0.5px var(--window-border);
  color: var(--label); user-select: none; -webkit-user-select: none;
}
.pn-label { font-size: 11px; font-weight: 600; color: var(--label2); display: flex; align-items: baseline; gap: 6px; margin-top: 4px; white-space: nowrap; min-width: 0; }
.pn-label .cnt { margin-left: auto; font-weight: 400; flex: 0 0 auto; }
.pn-label .contents-path { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.search {
  display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 6px 0 8px; border-radius: 7px; background: var(--search-bg);
  box-shadow: inset 0 0 0 0.5px var(--control-border); cursor: text; flex: 0 0 auto; min-width: 0; overflow: hidden;
}
.search:focus-within { box-shadow: 0 0 0 3.5px var(--focus-ring), inset 0 0 0 1px var(--accent); background: var(--field-bg); }
.search svg.mag { width: 14px; height: 14px; color: var(--label2); flex: 0 0 auto; }
.search.nfmode svg.mag { color: var(--accent); }
.qwrap { position: relative; flex: 1 1 40px; min-width: 40px; height: 100%; display: flex; align-items: center; overflow: hidden; }
.search input { width: 100%; border: 0; background: transparent; outline: none; height: 100%; font-size: 13px; padding: 0; position: relative; z-index: 1; }
.search input::placeholder { color: var(--label3); }
.ghost { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; white-space: pre; color: var(--label3); font-size: 13px; pointer-events: none; }
.search .clear { border: 0; background: transparent; color: var(--label3); width: 18px; height: 18px; padding: 0; display: inline-flex; cursor: default; flex: 0 0 auto; }
.search .clear svg { width: 15px; height: 15px; }

/* concept A: the committed path before the caret */
.apath { display: inline-flex; align-items: center; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; color: var(--label2); }
.apath .pseg { display: inline-flex; align-items: center; flex: 0 0 auto; }
.apath .pseg:last-of-type { flex: 0 1 auto; min-width: 0; }
.apath .pseg:last-of-type .seg-btn { overflow: hidden; text-overflow: ellipsis; min-width: 0; white-space: nowrap; }
.apath .seg-btn { border: 0; background: transparent; padding: 0 1px; border-radius: 3px; color: var(--label2); cursor: default; font-size: 13px; }
.apath .seg-btn:hover { color: var(--label); background: var(--hover-bg); text-decoration: underline; text-underline-offset: 2px; }
.apath .psep { color: var(--label3); padding: 0 4px; }
.apath .ell { color: var(--label3); flex: 0 0 auto; }
.apath .badge-new { margin: 0 4px 0 0; }
.badge-new { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; background: var(--new-badge-bg); color: var(--new-badge-fg); border-radius: 4px; padding: 1px 4px; flex: 0 0 auto; }

/* picker box */
.picker { display: flex; flex-direction: column; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 0.5px var(--control-border); background: var(--control-bg); }
.pathbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 1px; padding: 4px 6px; border-bottom: 0.5px solid var(--separator);
  overflow-x: auto; white-space: nowrap; font-size: 12px; scrollbar-width: none;
}
.pathbar::-webkit-scrollbar { display: none; }
.pathbar .crumb { border: 0; background: transparent; padding: 1px 5px; border-radius: 4px; color: var(--label2); cursor: default; flex: 0 0 auto; }
.pathbar .crumb:hover { background: var(--hover-bg); color: var(--label); }
.pathbar .crumb.cur { color: var(--label); font-weight: 600; }
.pathbar .sep { color: var(--label3); font-size: 11px; flex: 0 0 auto; }
.list { position: relative; height: 288px; overflow-y: auto; padding: 4px; }
.pk-bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 4px; border-top: 0.5px solid var(--separator);
  background: var(--toolbar-bg);
}
.pk-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 0; border-radius: 5px; background: transparent;
  color: var(--label); font-size: 12px; cursor: default; white-space: nowrap; flex: 0 0 auto;
}
.pk-btn svg { width: 16px; height: 13px; color: var(--label2); }
.pk-btn:hover { background: var(--hover-bg); }
.pk-btn:active { background: var(--sel-unfocused); }
.pk-hint { margin-left: auto; font-size: 11px; color: var(--label3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-right: 4px; }
.pk-hint.flash { color: var(--warn-fg); }

.res-h { font-size: 11px; font-weight: 600; color: var(--label2); padding: 6px 6px 3px; display: flex; gap: 6px; }
.res-h .cnt { font-weight: 400; margin-left: auto; }
.res-h.hair { border-top: 0.5px solid var(--separator); margin-top: 6px; padding-top: 8px; }
.res-sep { height: 0.5px; background: var(--separator); margin: 3px 6px; }
.res {
  display: flex; align-items: center; gap: 7px; min-height: 24px; padding: 2px 4px 2px 6px; border-radius: 5px; cursor: default; white-space: nowrap; overflow: hidden;
}
.res .fold, .nf-row .fold { width: 15px; height: 13px; flex: 0 0 15px; }
.res .rt { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.par { color: var(--label2); }
.last { color: var(--label); }
.res b { font-weight: 700; }
.par b { color: var(--label); }
.res:not(.inert):hover { background: var(--hover-bg); }
.res.inert { opacity: 0.75; }
.res.hl { background: var(--sel-unfocused); }
.pk-focus .res.hl { background: var(--accent); color: var(--accent-fg); }
.pk-focus .res.hl .par, .pk-focus .res.hl .last, .pk-focus .res.hl .par b, .pk-focus .res.hl .into, .pk-focus .res.hl .check { color: var(--accent-fg); }
.res.self .par { font-style: normal; }
.check { flex: 0 0 auto; width: 14px; height: 14px; display: inline-flex; color: var(--accent); }
.check svg { width: 14px; height: 14px; }
.into {
  flex: 0 0 auto; width: 20px; height: 18px; border: 0; padding: 0; border-radius: 4px; background: transparent; color: var(--label3);
  display: inline-flex; align-items: center; justify-content: center; cursor: default;
}
.into svg { width: 11px; height: 11px; }
.into:hover { background: var(--sel-unfocused); color: var(--label); }
.create { color: var(--accent); }
.create svg.plus { width: 13px; height: 13px; flex: 0 0 13px; }
.pk-focus .create.hl { color: var(--accent-fg); }
.nfprev .rt .par { font-style: italic; }
.res-empty { color: var(--label2); padding: 6px 8px; font-size: 12px; line-height: 1.4; white-space: normal; }

/* new-folder row (B, C: as today) */
.nf-row { margin: 2px 0 4px; padding: 6px 6px 7px; border-radius: 6px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 4px; }
.nf-row .nf-line { display: flex; align-items: center; gap: 5px; }
.nf-row input {
  flex: 1; min-width: 0; height: 22px; border-radius: 4px; border: 0; background: var(--field-bg); box-shadow: inset 0 0 0 0.5px var(--control-border);
  padding: 0 6px; outline: none; font-size: 12.5px;
}
.nf-row input:focus { box-shadow: 0 0 0 3px var(--focus-ring), inset 0 0 0 1px var(--accent); }
.nf-row .nf-note { font-size: 10.5px; line-height: 1.35; color: var(--label2); white-space: normal; }
.nf-row .nf-note.warn { color: var(--warn-fg); }

/* folder contents */
.contents { position: relative; height: 112px; overflow-y: auto; border-radius: 7px; box-shadow: inset 0 0 0 0.5px var(--control-border); padding: 3px 4px; background: var(--control-bg); }
.ct { display: flex; align-items: center; gap: 7px; height: 22px; padding: 0 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; color: var(--label); cursor: default; }
.ct:nth-child(even) { background: var(--table-alt); }
.ct:hover { background: var(--hover-bg); }
.ct .ficon { transform: scale(0.8); }
.ct .tn { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ct.taken { background: var(--taken-row) !important; }
.ct-empty { color: var(--label3); font-size: 12px; padding: 8px 6px; line-height: 1.4; white-space: normal; }
.ficon { width: 15px; height: 19px; display: inline-block; flex: 0 0 auto; }
.ficon svg { width: 100%; height: 100%; display: block; }

/* name */
.namewrap { position: relative; }
.namebox {
  display: flex; align-items: center; height: 28px; border-radius: 6px; background: var(--field-bg); gap: 4px;
  box-shadow: inset 0 0 0 0.5px var(--control-border), var(--control-shadow); padding: 0 8px; cursor: text;
}
.namebox:focus-within { box-shadow: 0 0 0 3.5px var(--focus-ring), inset 0 0 0 1px var(--accent); }
.namebox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; font-size: 13px; padding: 0; }
.namebox .ext { color: var(--label2); flex: 0 0 auto; }
.toast {
  position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); z-index: 5; white-space: nowrap;
  background: var(--toast-bg); color: var(--toast-fg); font-size: 12px; padding: 4px 10px; border-radius: 6px; box-shadow: var(--control-shadow);
  animation: toast-in .15s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -3px); } to { opacity: 1; transform: translate(-50%, 0); } }
.pn-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.btn {
  height: 28px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--button-bg); color: var(--label);
  box-shadow: var(--control-shadow), 0 0 0 0.5px var(--control-border); font-size: 13px; cursor: default; white-space: nowrap;
}
.btn.default { background: var(--accent); color: var(--accent-fg); box-shadow: var(--control-shadow); }
.btn.default:hover:not(:disabled) { background: var(--accent-hover); }
.btn:disabled { opacity: 0.4; }
.btn .k { opacity: 0.75; margin-left: 4px; font-size: 11.5px; }

/* status */
.status {
  margin: 12px 0 0; padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-border);

      for (const p of rec) items.push(folderRow(p, p, { section: 'recent' }));
    }
    items.push({ type: 'header', text: 'All folders' });
    for (const p of kids('')) items.push(folderRow(p, p));

    // The folder you stand in is choosable itself, as the first row.

    const items = [folderRow(scope, lastSeg(scope) || 'Archive', { self: true, inert: true }), { type: 'sep' }];
    const v = S.query.trim();
    const res = v ? resolveNew(scope, v) : null;
    items.push({ type: 'nfpreview', parent: scope, value: v, existing: res && res.existing });
    items.push({ type: 'info', text: res && res.existing ? `${where(lastSeg(scope))} already contains “${lastSeg(res.existing)}”. Return selects it.` : 'Type the name; a slash nests. Tab or Return confirms, Esc cancels.' });

  const create = q.trimEnd().endsWith('/') ? null : createRow(scope, q, true);

  if (results.length) {
    items.push({ type: 'header', text: countText(results.length, scope) });
    for (const r of results.slice(0, MAX_RESULTS)) items.push({ type: 'folder', ...r, section: 'results' });

    // so its create row is offered next to partial matches.

    if (all.length) {
      items.push({ type: 'header', text: `Not in ${lastSeg(scope)} – elsewhere`, hairline: true });

}
/* Long paths lose their head: "… / Margit / Physiotherapie /". */
function fitPath() {
  const apath = $('aPath');
  const box = $('filterBox');
  // Leave room for typing; with an empty query the path may take nearly the whole field.
  const max = Math.max(60, box.clientWidth - (S.query ? 140 : 108));
  const segs = [...apath.querySelectorAll('.pseg')];
  const ell = apath.querySelector('.ell');
  segs.forEach((s) => { s.hidden = false; });
  ell.hidden = true;
  for (let i = 0; i < segs.length - 1 && apath.scrollWidth > max; i++) { segs[i].hidden = true; ell.hidden = false; }
}
let measureCtx = null;
function renderGhost() {
  const ghost = $('ghost');
  ghost.textContent = '';
  if (S.concept !== 'A' || S.nf || S.focus !== 'picker') return;
  const inp = $('filterInput');
  if (!S.query || inp.selectionStart !== S.query.length || inp.selectionEnd !== S.query.length) return;
  const h = highlighted();
  if (!h || h.type !== 'folder') return;
  const typed = S.query.slice(S.query.lastIndexOf('/') + 1);
  const tf = foldStr(typed);
  const name = lastSeg(h.path);
  if (!tf || !foldStr(name).startsWith(tf)) return;
  let i = 0;
  while (i < name.length && foldStr(name.slice(0, i)).length < tf.length) i++;
  if (foldStr(name.slice(0, i)).length !== tf.length || i >= name.length) return;
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  const cs = getComputedStyle(inp);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  ghost.textContent = name.slice(i);
  ghost.style.left = `${measureCtx.measureText(S.query).width - inp.scrollLeft}px`;
}

function rowHtml(it, si, hlItem) {
  const isHl = it === hlItem;
  if (it.type === 'create') {
    const tip = S.concept === 'A' ? '⇧⌘N or a click creates it' : 'Tab, Return or ⇧⌘N creates it';
    return `<div class="res create${isHl ? ' hl' : ''}" role="option" aria-selected="${isHl}" id="row-${si}" data-act="create" data-si="${si}" title="${tip}">${ICON.plus}<span class="rt">New Folder “${esc(it.name)}” in ${esc(where(it.parent))}</span></div>`;
  }
  if (it.type === 'nfpreview') {
    const label = it.value ? pathHtml(it.value, new Set()) : '<span class="par">untitled folder</span>';
    return `<div class="res nfprev${isHl ? ' hl' : ''}" role="option" aria-selected="${isHl}" id="row-${si}">${ICON.folder}<span class="rt">${label}</span>${it.existing ? '' : '<span class="badge-new">New</span>'}</div>`;
  }
  const chosenMark = S.chosen && S.chosen === it.path && (S.concept !== 'A' || it.self);
  const hasKids = !it.self && kids(it.path).length > 0;
  const label = it.self ? `<span class="last">${esc(it.display)}</span><span class="par"> — this folder</span>` : pathHtml(it.display, it.marks);
  const cls = `res${isHl ? ' hl' : ''}${it.self ? ' self' : ''}${chosenMark ? ' chosen' : ''}${it.inert ? ' inert' : ''}`;
  const act = it.inert ? '' : ` data-act="row" data-si="${si}"`;
  return `<div class="${cls}" role="option" aria-selected="${isHl}" id="row-${si}"${act} title="${esc(it.path)}">${it.self ? ICON.here : ICON.folder}<span class="rt">${label}</span>${isNew(it.path) ? '<span class="badge-new">New</span>' : ''}${chosenMark ? `<span class="check" title="Chosen destination">${ICON.check}</span>` : ''}${hasKids ? `<button type="button" class="into" data-act="into" data-path="${esc(it.path)}" tabindex="-1" title="${S.concept === 'A' ? 'Into the path (→)' : 'Show subfolders (→)'}" aria-label="Into ${esc(lastSeg(it.path))}">${ICON.chev}</button>` : ''}</div>`

}
function renderPathBar() {
  const pb = $('pathBar');
  pb.hidden = S.concept === 'A';
  if (pb.hidden) return;
  const loc = S.nf ? S.nf.parent : S.scope;
  const crumbs = [{ path: '', name: 'Archive' }].concat(chainOf(loc).map((p) => ({ path: p, name: lastSeg(p) })));
  pb.innerHTML = crumbs.map((c, i) => `${i ? '<span class="sep" aria-hidden="true">›</span>' : ''}<button type="button" class="crumb${i === crumbs.length - 1 ? ' cur' : ''}" data-act="crumb" data-path="${esc(c.path)}" tabindex="-1" title="${c.path ? esc(c.path) : 'Archive root (⌘↑)'}">${esc(c.name)}</button>`).join('');
  pb.scrollLeft = pb.scrollWidth;
}
function renderList() {
  const list = $('list');
  const all = items();
  const sel = selectable();
  S.hl = clamp(S.hl, 0, Math.max(0, sel.length - 1));
  const hlItem = sel[S.hl];
  let si = -1, html = '';
  for (const it of all) {
    if (it.type === 'header') { html += `<div class="res-h${it.hairline ? ' hair' : ''}">${esc(it.text)}${it.count !== undefined ? `<span class="cnt">${it.count}</span>` : ''}</div>`; continue; }
    if (it.type === 'sep') { html += '<div class="res-sep"></div>'; continue; }
    if (it.type === 'info') { html += `<div class="res-empty">${esc(it.text)}</div>`; continue; }
    if (it.type === 'nfslot') {
      const rows = kids(it.parent).map((p) => ({ name: lastSeg(p), html: `<div class="res inert" title="${esc(p)}">${ICON.folder}<span class="rt"><span class="last">${esc(lastSeg(p))}</span></span>${isNew(p) ? '<span class="badge-new">New</span>' : ''}</div>` }));
      const first = (S.nf.value.split('/')[0] || '').trim();
      const before = rows.filter((r) => first && collator.compare(r.name, first) < 0), after = rows.filter((r) => !(first && collator.compare(r.name, first) < 0));
      const n = nfNotice(it.parent, S.nf.value);
      html += before.map((r) => r.html).join('') + `<div class="nf-row" id="nfRowBox"><div class="nf-line">${ICON.folder}<span id="nfSlot"></span></div><div class="nf-note${n.warn ? ' warn' : ''}">${esc(n.text)}</div></div>` + after.map((r) => r.html).join('');
      continue;
    }
    if (isSelectable(it)) si++;
    html += rowHtml(it, isSelectable(it) ? si : -1, hlItem);
  }
  list.innerHTML = html;
  const slot = $('nfSlot');
  if (slot) {
    if (!nfInputEl) createNfInput();
    nfInputEl.setAttribute('aria-label', `New folder name in ${where(S.nf.parent)}`);
    if (nfInputEl.value !== S.nf.value) nfInputEl.value = S.nf.value;
    const ss = nfInputEl.selectionStart, se = nfInputEl.selectionEnd;
    slot.replaceWith(nfInputEl);
    if (S.focus === 'newfolder') { nfInputEl.focus({ preventScroll: true }); try { nfInputEl.setSelectionRange(ss ?? S.nf.value.length, se ?? S.nf.value.length); } catch (err) { /* not a text field state */ } }
  }
  // Keep the highlight in view; reset scroll when the listing changes.
  const key = itemsCache.key;
  if (key !== lastListKey) { list.scrollTop = 0; lastListKey = key; }
  const target = list.querySelector('.res.hl') || $('nfRowBox');
  if (target) {
    const top = target.offsetTop, bottom = top + target.offsetHeight;
    if (top < list.scrollTop + 22) list.scrollTop = Math.max(0, top - 26);
    else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 4;
    if (target.id) $('filterInput').setAttribute('aria-activedescendant', target.id);
  }
}
function renderBar() {
  const h = highlighted();
  const btn = $('newFolderBtn');
  btn.innerHTML = `${ICON.newFolder}<span>New Folder</span>`;
  const parent = S.nf ? S.nf.parent : h && h.type === 'folder' ? h.path : S.scope;
  btn.title = h && h.type === 'create' ? `New Folder “${h.name}” in ${where(h.parent)} (⇧⌘N)` : `New Folder in ${where(parent)} (⇧⌘N)`;
  btn.setAttribute('aria-label', btn.title);
  $('pickerHint').textContent = S.hint || (S.concept === 'A' ? '→ complete · ⌫ back · / path' : '→ into folder · ← out');
  $('pickerHint').classList.toggle('flash', !!S.hint);
}
function renderContents() {
  const box = $('contents');
  const folder = contentsFolder();
  const pathEl = $('contentsPath'), cnt = $('contentsCount');
  if (!folder) {
    pathEl.textContent = 'Files'; cnt.textContent = '';
    const h = highlighted();
    box.innerHTML = `<div class="ct-empty">${S.nf || (h && (h.type === 'create' || h.type === 'nfpreview')) ? 'A new folder is empty; docsort creates it when you move the file.' : 'Highlight a folder to see its files.'}</div>`;
    box.dataset.folder = '';
    return;
  }
  pathEl.textContent = `Files in ${crumbText(folder)}`; pathEl.title = folder;
  if (isNew(folder)) {
    cnt.textContent = '';
    box.innerHTML = '<div class="ct-empty">New folder. docsort creates it when you move the file, so cancelling leaves nothing behind.</div>';
    box.dataset.folder = folder;
    return;
  }
  const files = contentsOf(folder);
  cnt.textContent = files.length === 1 ? '1 file' : `${files.length} files`;
  const taken = S.take && S.take.folder === folder ? S.take.idx : -1;
  box.innerHTML = files.length
    ? files.map((n, i) => `<div class="ct${i === taken ? ' taken' : ''}" data-act="ct" data-i="${i}" title="Click to use “${esc(stemOf(n))}” as the name">${fileIcon(n)}<span class="tn">${esc(n)}</span></div>`).join('')
    : '<div class="ct-empty">No files yet.</div>';
  if (box.dataset.folder !== folder) { box.scrollTop = box.scrollHeight; box.dataset.folder = folder; }
}
function renderName() {
  const inp = $('nameInput');
  if (inp.value !== S.name) inp.value = S.name;
  const toast = $('toast');
  toast.hidden = !S.toast;
  toast.textContent = S.toast;
  const t = moveTarget();
  $('moveBtn').disabled = !t.path && !(t.create && !t.blocked);
}
function renderStatus() {
  const el = $('status');
  if (S.moved) { el.innerHTML = S.moved; el.classList.add('moved'); return; }
  el.classList.remove('moved');
  const t = moveTarget();
  const name = esc(effectiveStem() + FILE_EXT);
  if (t.path) el.innerHTML = `Move would file into <b>${esc(t.path)}</b> as <b>${name}</b>${isNew(t.path) ? ' (new folder)' : ''}.`;
  else if (t.create && !t.blocked) el.innerHTML = `Move would create <b>${esc(t.create.path)}</b> and file into it as <b>${name}</b>.`;
  else el.innerHTML = `Move: ${esc(t.blocked || 'nothing to file into yet.')}`;
}
function applyFocus() {
  const panelFocus = S.focus === 'picker' || S.focus === 'newfolder';
  $('panel').classList.toggle('pk-focus', panelFocus);
  $('sidebar').classList.toggle('focused', S.focus === 'sidebar');
  if (!S.pendingFocus) return;
  S.pendingFocus = false;
  const el = S.focus === 'picker' ? $('filterInput') : S.focus === 'newfolder' ? nfInputEl : S.focus === 'name' ? $('nameInput') : S.focus === 'sidebar' ? $('sidebar') : null;
  if (el && document.activeElement !== el) el.focus({ preventScroll: true });
  if (S.focus === 'picker') { const inp = $('filterInput'); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function render() {
  rendering = true;
  try {
    renderHeader();
    renderField();
    renderPathBar();
    renderList();
    renderBar();
    renderContents();
    renderName();
    renderStatus();
    applyFocus();
    if (S.selectName && S.focus === 'name') { $('nameInput').select(); S.selectName = false; }
    renderGhost();
  } finally {
    rendering = false;
  }
}

/* ---------------------------------------------------------------- DOM events */
function createNfInput() {
  nfInputEl = document.createElement('input');
  nfInputEl.id = 'nfInput';
  nfInputEl.type = 'text';
  nfInputEl.autocomplete = 'off';
  nfInputEl.spellcheck = false;
  nfInputEl.placeholder = 'Folder name';
  nfInputEl.addEventListener('input', () => { if (S.nf) { S.nf.value = nfInputEl.value; S.moved = ''; render(); } });
}
function keyOf(e) {
  let key = e.key;
  if (key.length === 1 && (e.metaKey || e.ctrlKey || e.altKey)) {
    if (/^Key[A-Z]$/.test(e.code)) key = e.code.slice(3).toLowerCase();
    else if (/^Digit\d$/.test(e.code)) key = e.code.slice(5);
  }
  if (key.length === 1 && /^[A-Z]$/.test(key) && e.shiftKey && (e.metaKey || e.ctrlKey)) key = key.toLowerCase();
  return { key, cmd: e.metaKey, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey };
}
function caretOf(el) {
  if (el && typeof el.selectionStart === 'number') return { start: el.selectionStart, end: el.selectionEnd, len: el.value.length };
  return { start: 0, end: 0, len: 0 };
}
function stopOf(el) {
  if (!el) return 'none';
  if (el.id === 'filterInput') return 'picker';
  if (el.id === 'nfInput') return 'newfolder';
  if (el.id === 'nameInput') return 'name';
  if (el.id === 'sidebar') return 'sidebar';
  return 'none';
}
if (HAS_DOM) {
  // Capture phase, so ⌃1–3 and ⌘Return reach us whatever is focused.
  window.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    const k = keyOf(e);
    const a = document.activeElement;
    const stop = stopOf(a);
    if (stop !== S.focus && stop !== 'none') S.focus = stop;
    if (stop === 'none' && S.focus !== 'none' && !(k.ctrl && /^[123]$/.test(k.key))) S.focus = 'none';
    let handled = handleKey(k, caretOf(a));
    if (!handled && stop === 'none' && isMoveKey(k) && a && $('panel').contains(a)) { moveNow(); handled = true; }
    if (handled) {
      e.preventDefault();
      e.stopPropagation();
      if (!isMoveKey(k)) S.moved = '';
      render();
    }
  }, true);
  // After the browser moved the caret (← → Home End), the ghost text may appear or go.
  window.addEventListener('keyup', () => { if (S.concept === 'A') renderGhost(); });

  $('filterInput').addEventListener('input', (e) => {
    if (S.focus !== 'picker') S.focus = 'picker';
    setQueryFromUser(e.target.value);
    render();
  });
  $('nameInput').addEventListener('input', (e) => { S.name = e.target.value; S.take = null; S.moved = ''; render(); });
  $('filterInput').addEventListener('click', () => renderGhost());

  document.addEventListener('focusin', (e) => {
    if (rendering) return;
    const stop = stopOf(e.target);
    if (stop === 'none' || stop === S.focus) return;
    if (S.nf && S.concept !== 'A' && S.focus === 'newfolder' && stop !== 'newfolder') cancelNf(false);
    if (S.nf && S.concept === 'A' && stop !== 'picker') cancelNf(false);
    S.focus = stop;
    render();
  });
  document.addEventListener('focusout', () => {
    if (rendering) return;
    setTimeout(() => {
      if (rendering) return;
      const stop = stopOf(document.activeElement);
      if (stop === 'none' && S.focus !== 'none') { S.focus = 'none'; render(); }
    }, 0);
  });

  // Clicks inside the panel and on header controls keep focus where it is; handlers move it on purpose.
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('input')) return;
    if (e.target.closest('#panel') || e.target.closest('[data-act="concept"], [data-act="theme"], [data-act="reset"]')) e.preventDefault();
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target.closest('#filterBox')) { wantFocus('picker'); render(); }
      return;
    }
    const act = el.dataset.act;
    S.moved = '';
    switch (act) {
      case 'concept': switchConcept(el.dataset.concept); break;
      case 'theme': setTheme(el.dataset.themeChoice); return;
      case 'reset': S.done[S.concept] = new Set(); resetPanel(); wantFocus('picker'); break;
      case 'row': {
        if (e.detail >= 2) return;
        if (S.nf) cancelNf(false);
        unchoose();
        S.hl = +el.dataset.si;
        wantFocus('picker');
        break;
      }
      case 'into': if (e.detail >= 2) return; if (S.nf) cancelNf(false); stepInto(el.dataset.path); wantFocus('picker'); break;
      case 'create': {
        S.hl = +el.dataset.si;
        const h = highlighted();
        if (h && h.type === 'create') createFrom(h);
        break;
      }
      case 'crumb': if (S.nf) cancelNf(false); jumpTo(el.dataset.path); wantFocus('picker'); break;
      case 'aseg': if (S.nf) cancelNf(false); jumpTo(el.dataset.path); wantFocus('picker'); break;
      case 'clear': if (S.nf) cancelNf(false); clearAll(); wantFocus('picker'); break;
      case 'newfolder': newFolderCmd(); break;
      case 'ct': {
        const folder = contentsFolder();
        const files = folder ? contentsOf(folder) : [];
        const i = +el.dataset.i;
        if (!files[i]) return;
        S.take = { folder, idx: i };
        S.name = stemOf(files[i]);
        wantFocus('name'); S.selectName = true;
        break;
      }
      case 'move': moveNow(); break;
      default: return;
    }
    render();
  });
  /* A double-click acts on the row its first click highlighted: steps in, or chooses a folder without subfolders. */
  document.addEventListener('dblclick', (e) => {
    const el = e.target.closest('[data-act="row"]');
    if (!el) return;
    const h = highlighted();
    if (!h || h.type !== 'folder') return;
    if (!h.self && kids(h.path).length) stepInto(h.path);
    else choose();
    render();
  });
  window.addEventListener('resize', () => { if (S.concept === 'A' && S.scope) fitPath(); renderGhost(); });
}

/* ---------------------------------------------------------------- theme (no storage: the choice lasts for this visit) */
function setTheme(choice) {
  if (choice === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', choice);
  document.querySelectorAll('#themeSeg button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.themeChoice === choice)));
  wantFocus(S.focus === 'none' ? 'picker' : S.focus);
  render();
}

/* ---------------------------------------------------------------- start */
resetPanel();
if (HAS_DOM) {
  wantFocus('picker');
  render();
  // Some hosts focus the frame late; try once more when the page is fully loaded.
  window.addEventListener('load', () => { if (stopOf(document.activeElement) === 'none') { wantFocus('picker'); render(); } });
}
</script>
